<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Abdur Rafay</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/portfolio/assets/favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: 'Zodiak'; src: url('/portfolio/assets/fonts/zodiak.woff2') format('woff2-variations'); font-weight: 300 700; font-display: swap; }
  @font-face { font-family: 'Switzer'; src: url('/portfolio/assets/fonts/switzer.woff2') format('woff2-variations'); font-weight: 300 700; font-display: swap; }
  @font-face { font-family: 'JetBrains Mono'; src: url('/portfolio/assets/fonts/jetbrainsmono-400.woff2') format('woff2'); font-display: swap; }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100svh; display: grid; place-content: center; gap: 1.25rem;
    padding: 2rem; background: #08090a; color: #ecedec;
    font-family: 'Switzer', ui-sans-serif, system-ui, sans-serif; line-height: 1.6;
  }
  .code { font-family: 'JetBrains Mono', monospace; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: #4ade80; }
  h1 { font-family: 'Zodiak', Georgia, serif; font-weight: 400; font-size: clamp(2rem, 1.4rem + 2.4vw, 3rem); line-height: 1.1; letter-spacing: -.02em; max-width: 18ch; }
  p { color: #9ba09d; max-width: 46ch; }
  a.btn {
    justify-self: start; display: inline-flex; align-items: center; gap: .5rem;
    margin-top: .5rem; padding: .7rem 1.15rem; border-radius: 999px;
    background: #22c55e; color: #04140b; text-decoration: none; font-weight: 500;
  }
  a.btn:hover { background: #4ade80; }
  @media (prefers-color-scheme: light) {
    body { background: #f4f3ef; color: #232824; }
    .code { color: #15803d; }
    p { color: #5b615c; }
    a.btn { background: #15803d; color: #f7fbf8; }
  }
</style>
</head>
<body>
  <span class="code">404</span>
  <h1>That page does not exist.</h1>
  <p>The link may be out of date, or the page moved. Everything lives on one page anyway.</p>
  <a class="btn" href="/portfolio/">Back to the portfolio</a>
</body>
</html>
